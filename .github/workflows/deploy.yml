name: CI/CD Pipeline

on:
  push:
    branches: [ WebService-Cloud, main ]
  pull_request:
    branches: [ WebService-Cloud, main ]

jobs:
  backend-test-and-build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install dependencies
      run: npm install

    - name: Prisma Generate
      run: npx prisma generate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}

    - name: Run Tests
      run: npm test
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}

    - name: Run Build
      run: npm run build

  # Bước deploy có thể thêm vào sau khi workflow test/build đã chạy ổn định
  # deploy:
  #   needs: backend-test-and-build
  #   if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/WebService-Cloud')
  #   ...
