# Định danh dự án — phải khớp với trên SonarCloud
sonar.projectKey=L02-CockRoaches_main-app
sonar.organization=l02-cockroaches

sonar.projectName=main-app
sonar.projectVersion=1.0.0

# Thư mục source code
sonar.sources=frontend/app

# File test
sonar.tests=frontend/__tests__
sonar.test.inclusions=**/__tests__/**/*.test.tsx,**/__tests__/**/*.test.ts

# Bỏ qua các thư mục không cần phân tích
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.d.ts,**/assets/**,**/sentry-example-page/**,**/api/sentry-example-api/**,frontend/app/global-error.tsx,frontend/app/**/_layout.tsx,frontend/app/(tabs)/explore.tsx

# React Native screen files contain repeated JSX/style structures by design.
sonar.cpd.exclusions=frontend/app/index.tsx,frontend/app/(tabs)/home.tsx,frontend/app/(tabs)/profile.tsx

# Coverage report từ Jest
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
